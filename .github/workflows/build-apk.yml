name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        
        run: for f in *; do if [ -f "$f" ] && unzip -tq "$f" >/dev/null 2>&1; then unzip -q "$f"; break; fi; done

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Aceptar licencias del Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK
        working-directory: serpientin-android
        run: gradle assembleDebug --no-daemon

      - name: Publicar el APK en un Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp serpientin-android/app/build/outputs/apk/debug/app-debug.apk Serpientin-Serpientosos.apk
          gh release create "apk-${{ github.run_number }}" Serpientin-Serpientosos.apk \
            --title "Serpientín Serpientosos (compilación ${{ github.run_number }})" \
            --notes "APK de depuración, listo para instalar."
